[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ratiss-hpc"
version = "1.0.0"
description = "Cluster de calcul local souverain (8x RK3588, 64 coeurs, 100% solaire) — Priorité 3 RATISS"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jonathan Evina", email = "samajonathan9@gmail.com"},
    {name = "JOHNKING0"},
]
keywords = ["HPC", "cluster", "RK3588", "solaire", "souveraineté", "Cameroun"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
test = ["pytest>=7.0", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/samajonathan9-source/ratiss-hpc"
Repository = "https://github.com/samajonathan9-source/ratiss-hpc"

[tool.setuptools.packages.find]
include = ["ratiss_hpc*"]
